<style>
/* Layout concept: a financial-wire front page. Wordmark and a figures rail on top,
   short notes on the left, a levels table on the right. No cards, only rules. */
:root{
  --bg:#EDF0F3; --surface:#F8F9FB; --ink:#0F1B2D; --muted:#566377; --rule:#C9D1DB;
  --chip:#DFE5EC; --accent:#2433C7; --accent-ink:#FFFFFF;
  --up:#0A7447; --down:#BE2F29; --warn:#8A5A00;
  --display:"Archivo","Arial Narrow",Arial,sans-serif;
  --body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#0E0E0E; --ink:#EDEDED; --muted:#9B9B9B; --rule:#2B2B2B;
  --chip:#1A1A1A; --accent:#8F9CFF; --accent-ink:#000000;
  --up:#4FD08F; --down:#FF7A72; --warn:#E6B450; color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font-family:var(--body); font-size:17px; line-height:1.6;
  padding-block:20px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:1080px;margin:0 auto}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.label{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

/* Header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 28px;padding-bottom:14px}
.mark{display:block;text-decoration:none;font-family:var(--display);font-weight:800;font-stretch:70%;font-size:clamp(40px,9vw,72px);line-height:.92;text-transform:uppercase;letter-spacing:-.005em}
.today{margin-top:8px}
.nav{display:flex;flex-wrap:wrap;gap:6px 22px;align-items:center}
.nav a{font-family:var(--mono);font-size:13px;letter-spacing:.07em;text-transform:uppercase;text-decoration:none;padding:4px 0;border-bottom:2px solid transparent}
.nav a:hover{border-bottom-color:var(--rule)}
.nav a[aria-current="page"]{border-bottom-color:var(--accent)}
.theme{font:500 12px var(--mono);letter-spacing:.07em;text-transform:uppercase;background:none;color:var(--ink);border:1px solid var(--rule);padding:5px 10px;cursor:pointer}
.theme:hover{border-color:var(--ink)}

/* Figures rail */
.rail{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-block:2px solid var(--ink)}
.rail div{padding:10px 14px 10px 0;display:flex;flex-direction:column;gap:2px;min-width:0}
.rail .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:19px;font-weight:500}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--muted)}
.chg{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px}

.flagbar{margin:18px 0 0;padding:9px 12px;background:var(--chip);font-family:var(--mono);font-size:12px;line-height:1.5}

/* Home layout */
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,370px);gap:44px;margin-top:30px}
@media (max-width:880px){.cols{grid-template-columns:minmax(0,1fr);gap:36px}}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:1px solid var(--ink);padding-bottom:6px;margin:0 0 4px}
.sec-h h2{margin:0;font-family:var(--display);font-stretch:75%;font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.01em}
.sec-h a{font-family:var(--mono);font-size:12px;letter-spacing:.07em;text-transform:uppercase}

/* Notes list */
.nl{list-style:none;margin:0;padding:0}
.nl li{padding:20px 0;border-bottom:1px solid var(--rule)}
.nl .meta{display:flex;flex-wrap:wrap;gap:4px 12px}
.nl h3{margin:6px 0 6px;font-family:var(--display);font-stretch:80%;font-weight:700;font-size:clamp(24px,3.6vw,32px);line-height:1.1;text-wrap:balance}
.nl h3 a{text-decoration:none}
.nl h3 a:hover{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.nl p{margin:0;color:var(--muted);max-width:62ch}
.tag{font-family:var(--mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}

/* Snapshot */
.panel{background:var(--surface);border:1px solid var(--rule);padding:6px 16px 14px}
.panel table{width:100%;border-collapse:collapse}
.panel th{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:500;padding:14px 0 6px;border-bottom:1px solid var(--rule)}
.panel th.r,.panel td.r{text-align:right}
.panel td{padding:9px 0;border-bottom:1px solid var(--rule);vertical-align:top}
.panel tr:last-child td{border-bottom:0}
.panel td.n{padding-right:10px}
.panel td small{display:block;font-family:var(--body);font-size:13px;line-height:1.35;color:var(--muted);margin-top:1px}
.panel .lv{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:15px;white-space:nowrap}
.stamp{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin:0 0 10px}
.chip{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;padding:2px 7px;background:var(--chip)}
.scroll{overflow-x:auto}
.mt{min-width:520px}
.mt td.lv,.mt th.r{padding-left:14px}
.read{max-width:66ch;padding-left:20px;margin:14px 0 0}
.read li{margin-bottom:10px}

/* Views and log tables */
.page-h{font-family:var(--display);font-stretch:75%;font-weight:800;font-size:clamp(30px,5vw,44px);text-transform:uppercase;line-height:1;margin:34px 0 8px}
.lede{max-width:62ch;color:var(--muted);margin:0 0 24px}
.grid-t{width:100%;border-collapse:collapse}
.grid-t th{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:500;padding:8px 14px 8px 0;border-bottom:2px solid var(--ink)}
.grid-t td{padding:16px 14px 16px 0;border-bottom:1px solid var(--rule);vertical-align:top;font-size:15.5px;line-height:1.5}
.pill{display:inline-block;font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border:1px solid currentColor;white-space:nowrap}
.pill.bullish,.pill.right{color:var(--up)} .pill.bearish,.pill.wrong{color:var(--down)}
.pill.neutral{color:var(--muted)} .pill.open{color:var(--accent)} .pill.partly{color:var(--warn)}
@media (max-width:760px){
  .grid-t thead{display:none}
  .grid-t,.grid-t tbody,.grid-t tr,.grid-t td{display:block}
  .grid-t tr{padding:14px 0;border-bottom:1px solid var(--rule)}
  .grid-t td{border:0;padding:3px 0}
  .grid-t td[data-l]::before{content:attr(data-l);display:block;font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-top:6px}
  .grid-t td.first::before{display:none}
}

/* Notes page filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 6px}
.filters button{font:500 12px var(--mono);letter-spacing:.07em;text-transform:uppercase;background:none;color:var(--ink);border:1px solid var(--rule);padding:5px 11px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Article */
.art{max-width:68ch;margin:30px 0 0}
.back{font-family:var(--mono);font-size:12px;letter-spacing:.07em;text-transform:uppercase}
.art h1{font-family:var(--display);font-stretch:78%;font-weight:800;font-size:clamp(34px,6vw,54px);line-height:1.02;margin:14px 0 12px;text-wrap:balance}
.art .dek{font-size:20px;line-height:1.45;color:var(--muted);margin:0 0 14px}
.byline{display:flex;flex-wrap:wrap;gap:4px 14px;padding:10px 0;border-block:1px solid var(--rule);margin-bottom:22px}
.art h2{font-family:var(--display);font-stretch:80%;font-weight:700;font-size:23px;margin:28px 0 6px}
.art p,.art li{margin:0 0 14px}
.art ul,.art ol{padding-left:22px;margin:0 0 14px}
.takeaway{border-block:2px solid var(--ink);padding:12px 0 2px;margin:0 0 8px}
.takeaway p{font-size:19px;line-height:1.5;font-weight:500}
.sources{margin-top:30px;padding-top:12px;border-top:1px solid var(--rule);font-size:14px}
.sources ul{list-style:none;padding:0;margin:6px 0 0}
.sources li{margin:0 0 4px}
.pn{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;margin-top:34px;padding-top:14px;border-top:2px solid var(--ink)}
.pn a{text-decoration:none;max-width:46%;min-width:0}
.pn a:hover b{text-decoration:underline}
.pn b{display:block;font-family:var(--display);font-stretch:80%;font-size:18px;line-height:1.2}
.about p{max-width:62ch}
.about ul{max-width:62ch;padding-left:20px}
.about li{margin-bottom:8px}


.earn-list{display:grid;gap:0}
.earn .meta{display:flex;flex-wrap:wrap;gap:4px 12px}
.earn{padding:20px 0;border-bottom:1px solid var(--rule);max-width:70ch}
.earn h3{margin:6px 0 4px;font-family:var(--display);font-stretch:80%;font-weight:700;font-size:clamp(22px,3.4vw,28px);line-height:1.1}
.earn .tk{color:var(--accent);font-size:.7em;letter-spacing:.06em;margin-right:6px}
.earn .ehead{margin:0 0 10px;color:var(--muted)}
.earn ul{padding-left:20px;margin:10px 0 12px}
.earn li{margin-bottom:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0 22px;margin:12px 0;border-top:1px solid var(--ink)}
.stats div{padding:8px 0;border-bottom:1px solid var(--rule);min-width:0}
.stats dt{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.stats dd{margin:2px 0 0;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:14px}
.cal{padding:12px 0;border-bottom:1px solid var(--rule);max-width:70ch}
.cal p{margin:4px 0 0;font-size:15.5px}
.heads{margin-top:28px}
.heads ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 44px}
.heads li{display:grid;align-content:start;gap:3px;padding:14px 0;border-bottom:1px solid var(--rule);min-width:0}
.heads p{margin:0;font-size:16px;line-height:1.5}
.heads p a{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.heads .hnote{font-size:11px;margin:12px 0 0;text-transform:none;letter-spacing:0;line-height:1.5}
@media (max-width:760px){.heads ul{grid-template-columns:minmax(0,1fr)}}
.art h3{font-family:var(--display);font-stretch:80%;font-weight:700;font-size:19px;margin:22px 0 4px}
.mv{width:100%;max-width:420px;border-collapse:collapse;margin:0 0 8px}
.mv th{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:500;padding:6px 12px 6px 0;border-bottom:2px solid var(--ink)}
.mv td{padding:7px 12px 7px 0;border-bottom:1px solid var(--rule);font-size:16px}
.mv .r{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;padding-right:0}
.mv th.r{text-align:right;padding-right:0}
.pgrid.one{grid-template-columns:minmax(0,1fr)}
.pgrid>*{min-width:0}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:22px;align-items:start}
.about .links{margin:6px 0 0}
.about .links a{font-family:var(--mono);font-size:13px;letter-spacing:.04em}
footer{margin-top:56px;padding-top:14px;border-top:2px solid var(--ink);display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 24px}
footer p{margin:0;font-size:13px;color:var(--muted);max-width:60ch;line-height:1.5}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

  /* Headlines for the Today page. Add new items at the top. tag: short label. */
  headlines: {
    asOf: "Tue 27 Oct 2026, 15:25 GMT",
    note: "Summarised from Yahoo Finance (via Zacks), TheStreet, Reuters (via Business Recorder), Alliance News (via LSE.co.uk), Newsquawk, investingLive, 24/7 Wall St and FinanceFeeds (headlines only). US closing figures are Monday's, with a Yahoo Finance ticker snapshot from early Tuesday trade (around 9:50 am New York); Asian moves are Tuesday's session and European items are from the morning. Where sources disagree (oil levels, gold and silver moves, and the direction of gold on Tuesday) the range is flagged. Headline-level facts only; Bloomberg and the FT were not read and not used.",
    items: [
      { tag: "AI", t: "Anthropic's IPO filing keeps driving the AI trade: the S-1 for a Nasdaq listing under \"ANT\" shows $16.29bn of revenue in the first half of 2026. US chip stocks gained about 2.8% on Monday, their biggest one-day jump in a month according to Reuters. Meta plans to raise $95bn for AI infrastructure, with an initial $35bn from share sales, and SpaceX says it has completed $40bn of debt financing to buy AI chips.", u: "https://finance.yahoo.com/markets/stocks/articles/stock-market-news-oct-27-072700640.html", src: "Yahoo Finance (Zacks), Reuters" },
      { tag: "US stocks", t: "US stocks were little changed in early Tuesday trade after Monday's AI-led gains (S&P 500 +0.7% to 7,676.77, Nasdaq +0.8%, Dow +0.3%): the S&P 500 was around 7,680, the Nasdaq about 0.3% higher and the Dow about 0.2% lower, with the VIX near 18. Traders are positioning for the Fed meeting and a heavy earnings week, with Microsoft, Apple and Amazon seen as the test of whether AI spending keeps supporting the market.", u: "https://finance.yahoo.com/markets/stocks/articles/stock-market-today-oct-27-135043351.html", src: "Yahoo Finance, TheStreet" },
      { tag: "Oil", t: "Oil eased on Tuesday as renewed Iran-related diplomacy cooled escalation fears: WTI (December) was around $101.5, down about 0.3% in early US trade, and Brent was also lower. Quoted levels differ by source and contract (Brent roughly $111 to $116), and Brent remains near a six-month high.", u: "https://finance.yahoo.com/markets/stocks/articles/stock-market-today-oct-27-135043351.html", src: "Yahoo Finance, TheStreet, Alliance News" },
      { tag: "Geopolitics", t: "Officials from Saudi Arabia, Turkey and Pakistan held talks with Iran in Tehran to head off a renewed escalation in the Middle East war, but the meeting ended without concrete announcements. Separately, US Trade Representative Greer warned that a $3.4bn European Investment Bank loan to Airbus threatens the US-EU aircraft truce, and the EU plans import curbs on Chinese chemicals and furniture.", u: "https://www.lse.co.uk/news/london-market-early-call-ftse-100-called-down-as-hsbc-falls-6-in-hk-4svqnc8is4tagy2.html", src: "Alliance News, Newsquawk" },
      { tag: "Earnings", t: "More than a third of S&P 500 companies report this week, including Alphabet, Microsoft and Amazon. Verizon beat on adjusted earnings but missed on revenue and fell 3.5%; UPS rose about 1.6% premarket after raising its full-year guidance; Boeing posted a narrower-than-feared adjusted loss of 34 cents a share against a 21-cent loss expected, on revenue up 4% to $24.19bn. HSBC's third-quarter pre-tax profit rose 32% to $9.63bn but narrowly missed forecasts, and its shares fell in Hong Kong despite a new $1bn buyback.", u: "https://www.thestreet.com/stock-market-today/stock-market-today-dow-jones-sp-500-nasdaq-updates-oct-27-2026", src: "TheStreet, Yahoo Finance, Alliance News" },
      { tag: "Fed", t: "The Fed meets on Tuesday and Wednesday, with a decision on Wednesday and a press conference from Chair Kevin Warsh. Economists expect a hold and traders see only about an 11% chance of a hike this week, but roughly 82% for one in December. The US 10-year Treasury yield was about 5.0% in early US trade. The Bank of Canada and RBNZ decide on Wednesday (a third RBNZ hike is widely expected), the ECB on Thursday, and the Bank of Japan on Friday, when it is expected to flag a possible December hike. September PCE inflation is due on Thursday.", u: "https://www.brecorder.com/news/40446086/asian-stocks-surge-as-anthropic-ipo-lifts-sentiment-ahead-of-earnings-central-banks", src: "Reuters, FinanceFeeds" },
      { tag: "Gold", t: "Gold sits around the $4,000 mark after a three-month low of $3,975 on Friday. Sources disagree on Tuesday's direction: Asian-session reports had it slightly lower, while a Yahoo Finance ticker in early US trade showed about $4,055, up roughly 0.4%. Rate-hike bets and a firm dollar weigh on it. Silver fell in Asian trade, to roughly $53.", u: "https://financefeeds.com/gold-price-today-4004-tuesday-three-month-low-fomc-day-one-pce-thursday-bull-4110-bear-3890/", src: "FinanceFeeds, Yahoo Finance, TheStreet" },
      { tag: "Europe", t: "European shares rose on Monday: the DAX closed up about 1.0%, the CAC 40 up 0.8% and the Euro Stoxx 50 up 0.7%. Futures point slightly lower for Tuesday, down about 0.2%, with HSBC a drag. Porsche (about +2%) and Orange (about +1.4%) were indicated higher after results and an upgraded outlook from Orange.", u: "https://www.newsquawk.com/headlines/newsquawk-daily-european-equity-opening-news---27th-october-2026", src: "Newsquawk, Reuters" },
      { tag: "Asia", t: "Asian shares were mostly higher on Tuesday as the Anthropic filing revived tech: Korea's KOSPI rose 3.4%, triggering a sidecar, after third-quarter GDP growth of 1.0% beat the 0.7% forecast on AI chip exports, and Japan's Nikkei gained 1.7% on chips. China was softer, with the Shanghai Composite down 0.1% and the Hang Seng down 0.4% as HSBC fell. The yen weakened ahead of Friday's Bank of Japan decision, where a hold at 1.25% with a signal of further hikes is expected.", u: "https://investinglive.com/news/investinglive-asia-pacific-market-news-regional-stocks-mostly-rose/", src: "investingLive, Reuters" },
      { tag: "UK", t: "The FTSE 100 was called about 0.5% lower at the open after closing up 0.7% at 10,767 on Monday, with HSBC the main drag. Sterling was at about $1.333, down from $1.335 at Monday's close. Chancellor John Healey delivers his first Budget on Wednesday. UK shop price inflation came in at 2.1% against 1.6% expected, and the minimum wage is set to rise by nearly 4%.", u: "https://www.lse.co.uk/news/london-market-early-call-ftse-100-called-down-as-hsbc-falls-6-in-hk-4svqnc8is4tagy2.html", src: "Alliance News, Newsquawk" },
    ]
  },

    { id: "uk-typhoons-defend-saudi-arabia", date: "2026-10-24", tags: ["Geopolitics", "Commodities", "Macro"],
      title: "Britain is sending fighter jets to defend Saudi Arabia. Oil traders should notice.",
      dek: "The UK is stepping deeper into the Houthi\u2013Saudi conflict, the same war that has helped push Brent above $110. Here is what\u2019s being sent, why London says it\u2019s doing it, and what it signals.",
      sources: [],
      body: `
<div class="takeaway"><p>The UK Ministry of Defence announced that RAF Typhoon fighter jets will defend Saudi cities and critical infrastructure from Houthi missile and drone attacks. It is Britain\u2019s biggest step yet in the conflict, and it comes as Houthi strikes on the kingdom intensify. The government says the jets will be defensive only and \u201cwill not conduct offensive strikes against the Houthis\u201d.</p></div>
<h2>What the UK is sending</h2>
<ul>
<li>Typhoon fighters to defend Saudi cities and critical infrastructure.</li>
<li>An Atlas A400M transport aircraft to move heavy equipment around the country.</li>
<li>British military advisers to support Saudi staff officers.</li>
</ul>
<p>This builds on earlier steps. Last month Prime Minister Andy Burnham sent an RAF Voyager refuelling aircraft to Saudi Arabia, and Britain had already deployed air-defence equipment and military advisers.</p>
<h2>Why London says it\u2019s doing it</h2>
<ul>
<li><b>Defence of an ally.</b> Defence Secretary Wes Streeting called the attacks on Saudi Arabia \u201cabsolutely despicable\u201d. He singled out the attack on Riyadh\u2019s airport as showing \u201cthe lengths the Houthis are going to [to] escalate the situation in the region\u201d.</li>
<li><b>Cost of living.</b> The FT reports that Burnham tied his approval of Riyadh\u2019s request for military help to the government\u2019s drive to control the cost of living at home and keep oil supplies flowing. That is the main point for readers of this site: the UK is linking the war to your petrol and energy bills.</li>
<li><b>A limited commitment.</b> Burnham had tried to play down how long the Voyager would stay, signalling a matter of weeks. The new, larger deployment makes that harder to maintain.</li>
</ul>
<h2>The Houthi campaign</h2>
<ul>
<li>The Houthis attacked King Khalid International Airport in Riyadh earlier this month.</li>
<li>On Monday, Saudi Arabia postponed its flagship \u201cDavos in the Desert\u201d investment conference, due to begin the following week, after Houthi attacks on the country\u2019s airports.</li>
<li>On Tuesday the Saudi-led coalition said it intercepted a ballistic missile fired by the Houthis towards Riyadh.</li>
</ul>
<h2>Why it matters for markets (analysis)</h2>
<ul>
<li><b>Oil.</b> Saudi Arabia is the world\u2019s top oil exporter, so attacks on its infrastructure and airports keep supply risk in the price. Brent was around $112 this week after strikes on Aramco facilities. Western air defence could reduce the risk of damage to Saudi facilities, though it can\u2019t remove it.</li>
<li><b>Investment.</b> Postponing the investment conference is a signal that the kingdom\u2019s security problems are disrupting its efforts to attract foreign money. I haven\u2019t seen figures on any market impact.</li>
<li><b>Escalation risk.</b> Each additional Western commitment raises the chance of the conflict widening, even if the UK\u2019s role is defensive. That is the kind of risk oil traders price.</li>
<li><b>Inflation and rates.</b> Higher oil feeds inflation, which is why the Fed and the Bank of England are already tightening. This ties to the articles on this site on oil and on the Fed.</li>
</ul>
<h2>What to watch</h2>
<ol>
<li>Whether the Typhoons arrive, and whether other allies follow.</li>
<li>New Houthi strikes on Saudi airports, ports or oil facilities.</li>
<li>When the postponed Riyadh conference is rescheduled.</li>
<li>Whether the UK government\u2019s \u201cdefensive only\u201d line holds.</li>
<li>Brent: a spike above recent highs would show escalation fears.</li>
</ol>
<p><i>This article is for information only and is not investment advice.</i></p>` },
    { id: "us-preparing-for-long-war-with-iran", date: "2026-10-23", tags: ["Geopolitics", "Commodities", "Macro"],
      title: "America is preparing for a long war with Iran, and the oil market is the one paying for it",
      dek: "Nearly nine months in, a war that was meant to last \u201cfour to five weeks\u201d has no exit plan. Trump\u2019s UN ambassador now says that a year from now the US could still be in a stalemate.",
      sources: [],
      body: `
<div class="takeaway"><p>Mike Waltz, Donald Trump\u2019s ambassador to the UN, told the FT the US is ready for a protracted conflict with Iran. He conceded that a year from now there might still be no deal on Iran\u2019s nuclear programme and no return to prewar shipping through the Strait of Hormuz. For markets, that means the oil premium, which has helped push Brent above $110, is a feature of the next year rather than the next week.</p></div>
<h2>What was said</h2>
<ul>
<li><b>A long haul.</b> Waltz declined to speculate about hypotheticals but said the US Navy can keep its blockade of Iranian ports going \u201cfor the foreseeable future\u201d, and that the administration is tightening economic pressure.</li>
<li><b>The goal posts.</b> The US won\u2019t count its objectives as met until Iran\u2019s highly enriched nuclear material is disposed of and there is a \u201cmeaningful agreement\u201d on domestic enrichment.</li>
<li><b>The timeline.</b> Trump originally said the war would last four to five weeks. It is now approaching its ninth month.</li>
</ul>
<h2>The cost so far</h2>
<p>The FT reports record-high fuel prices, shortages of fertiliser and other commodities, and Iranian strikes on critical energy infrastructure across the Gulf states, which has crippled export routes from the world\u2019s top oil-producing region. Waltz said a global shortage of refined products is hitting industries \u201cfrom aviation to farmers\u201d and causing a humanitarian crisis in East Africa through the lack of fertiliser.</p>
<h2>The politics</h2>
<ul>
<li><b>Midterms on 3 November.</b> Trump\u2019s approval rating has dipped to around 31%, less than two weeks before the vote, and the Republicans are at risk of losing control of Congress amid anger about high prices. The war is unpopular with the public.</li>
<li><b>Renewed threats.</b> Trump and Israeli Prime Minister Benjamin Netanyahu have renewed threats of a fresh offensive on Iran after the midterms, according to the FT.</li>
<li><b>Pressure to settle.</b> Democrats and some Republicans want the focus put on a deal that returns Hormuz to prewar shipping levels and lets the region\u2019s energy sector rebuild. Waltz\u2019s stated terms are tougher than that.</li>
</ul>
<h2>The Russian diesel deal</h2>
<p>To bring down fuel costs, Trump struck a deal with Vladimir Putin this month allowing the sale of Russian diesel after years of sanctions. European and Ukrainian leaders objected that the revenue gives Moscow a lifeline to continue its war. Waltz defended it as needed to offset the shortage of refined products, and said the cash might give Russia an incentive to negotiate. It ties the Iran war directly to the Ukraine story, where the US is also pushing for talks.</p>
<h2>Why it matters for markets (analysis)</h2>
<ul>
<li><b>Oil.</b> A war with no end date keeps the Gulf risk premium in prices. Brent is already around $112 after attacks on Saudi Aramco\u2019s oilfield.</li>
<li><b>Inflation and the Fed.</b> Energy-driven inflation is why the Fed is already hiking, and a longer war makes rate cuts harder to expect.</li>
<li><b>A date to watch.</b> The most important date is 3 November. A bad result for Trump might raise pressure for a deal, while a renewed offensive after it would raise supply risk. Nobody can tell which, so I wouldn\u2019t treat either as a forecast.</li>
<li><b>Emerging markets.</b> Importers such as India are exposed to a longer oil shock, which links back to the India article on this site.</li>
</ul>
<h2>What to watch</h2>
<ol>
<li>The US midterms on 3 November, and any offensive that follows.</li>
<li>Whether talks restart on Hormuz and enrichment.</li>
<li>Brent: does it hold above $110?</li>
<li>European and Ukrainian reaction to the Russian diesel sales.</li>
<li>The Fed\u2019s decision on 28 October.</li>
</ol>
<p><i>This article is for information only and is not investment advice.</i></p>` },
    { id: "amazon-falls-4-percent-ai-bill", date: "2026-10-22", tags: ["AI", "Equities", "Earnings"],
      title: "Amazon fell 4%. It's the AI bill again, and earnings are a week away.",
      dek: "Amazon is the biggest spender in the AI build-out. On Thursday the market asked, for the second time this week, whether the money will come back.",
      sources: [],
      body: `
<div class="takeaway"><p>Amazon fell 3.9% on Thursday 22 October to close at $252.13, down $10.24. It was one of several mega-cap tech laggards in a day when the AI trade sold off. There was no Amazon-specific bad news in the reports I found. The reasons were general: worry about AI spending, pushback on data centres, and positioning ahead of results on 29 October.</p></div>
<h2>Why it fell</h2>
<ul>
<li><b>AI spending worries.</b> Amazon's projected AI infrastructure capex is about $220 billion. That has pushed its trailing twelve-month free cash flow to roughly -$7.6 billion, meaning it is spending more than the cash it generates. It's the same funding concern that hit Meta on Wednesday.</li>
<li><b>Pushback on data centres.</b> Reports point to political and local resistance to large AI data centres and scrutiny of local power grids. That raises the cost and the regulatory risk of building more.</li>
<li><b>Earnings are close.</b> Amazon reports its third-quarter results on 29 October. Traders often cut positions before results, and one source cited profit-taking after recent gains. Amazon opened down 3.5% while its retail sector was down 1.7%.</li>
<li><b>A broad selloff.</b> TSMC also fell nearly 4% and the chip sector fell about 3.5%. Amazon moved with the sector rather than on its own news.</li>
</ul>
<h2>The legal overhang</h2>
<p>On 31 August the FTC and 22 states sued Amazon, alleging it overcharged advertisers by more than $20 billion. This isn't new, but it adds risk.</p>
<h2>What hasn't changed</h2>
<p>Amazon's business is large and profitable. Annual revenue is about $717 billion and net profit about $78 billion. Analysts' average price target is about $324, against a range of $207 to $405, and most rate the stock a Buy. Management has guided revenue to $197 billion to $202 billion, which points to slower e-commerce growth and currency headwinds.</p>
<h2>Where Amazon fits in the AI-funding story</h2>
<p>The article on this site, "Why you're probably bankrolling the AI boom", argued that Big Tech is spending more than it earns. Amazon is the biggest example by capex dollars. Meta showed what happens when investors lose patience, and Amazon is the next test.</p>
<h2>What to watch on 29 October</h2>
<ol>
<li><b>AWS growth.</b> Does cloud revenue growth justify the spending?</li>
<li><b>Capex guidance.</b> Does Amazon raise or hold its $220 billion?</li>
<li><b>Free cash flow.</b> Does the negative trend deepen?</li>
<li><b>Retail guidance.</b> Is the slowdown in e-commerce growth a trend?</li>
<li><b>Reaction.</b> Meta beat on profit and still fell, so the move will depend on guidance more than on the numbers.</li>
</ol>
<p><i>This article is for information only and is not investment advice.</i></p>` },
    { id: "france-bond-yield-passes-5-percent", date: "2026-10-22", tags: ["Rates", "Macro"],
      title: "France's bond yield just passed 5%. It hasn't been this high since 2002.",
      dek: "The government can't pass a budget, the streets are in uproar, and the bond market is charging France more than it has in over two decades. Moody's decides on its credit rating tomorrow.",
      sources: [],
      body: `
<div class="takeaway"><p>On Wednesday 21 October, France's 10-year government bond yield rose above 5%, a level not seen since the early 2000s. Investors are demanding more to lend to a country with a deficit of about 5.4% of GDP, debt near 120% of GDP, and a government that has no comfortable majority to pass its 2027 budget. The protests of the past weekend turned violent. Moody's is due to review France's rating on Friday 23 October.</p></div>
<h2>What a bond yield tells you</h2>
<p>A bond yield is the interest rate a government pays to borrow. When investors worry about getting repaid, or about the politics, they ask for a higher yield. The key comparison is France's yield against Germany's, called the spread. It widened to about 160 basis points (1.6 percentage points), close to the widest since the 2011 eurozone debt crisis. On 2 October the spread was 152 basis points, and the cost of insuring French debt against default (five-year credit default swaps) rose to 81 basis points, the highest among major EU countries and the UK.</p>
<h2>The numbers</h2>
<ul>
<li><b>Deficit:</b> about 5.4% of GDP this year. The EU limit is 3%.</li>
<li><b>Debt:</b> about 119% of GDP this year, forecast to reach 122% next year.</li>
<li><b>Growth:</b> about 0.5% this year.</li>
<li><b>Borrowing:</b> the government plans to issue over $380 billion in medium- and long-term debt next year. Its financing need for 2027 is projected at €339.7 billion, about €28 billion more than this year.</li>
</ul>
<h2>The budget standoff</h2>
<p>Prime Minister Sébastien Lecornu is trying to pass the 2027 budget without a comfortable majority. It targets a 5.0% deficit with €43 billion of new measures, as part of a wider €54 billion adjustment. Investors doubt that parliament will deliver it. When the government set out its plan on 1 October, bond yields kept rising.</p>
<h2>The streets</h2>
<p>Over the weekend, large protests demanding more spending on public services and education turned into clashes. They were described as the most severe in years. This comes after weeks of public-sector strikes, barricaded high schools and blocked ports. High fuel prices, driven by the oil surge, add to the pressure on households.</p>
<h2>The ratings clock</h2>
<ul>
<li><b>Moody's:</b> France is rated Aa3 with a negative outlook. Its review is scheduled for 23 October and many observers expect a downgrade, though a review doesn't guarantee one. In early October Reuters reported that Moody's saw agreement on the 2027 budget as highly uncertain.</li>
<li><b>Scope:</b> it already cut France to A+ from AA- last month.</li>
</ul>
<p>A downgrade matters because some funds are only allowed to hold bonds above a certain rating, and a lower rating raises the government's borrowing costs.</p>
<h2>The 2027 election</h2>
<p>The bigger worry is politics. The presidential election is in spring 2027, and Marine Le Pen's National Rally leads in polls. She has proposed tax cuts and a retirement age as low as 60. On the far left, Jean-Luc Mélenchon has proposed having the central bank cancel its holdings of French debt. Neither side is seen as a fiscal hawk. Macquarie's Thierry Wizman puts the odds of a National Rally presidency near 50%, and calls an outright default a low-probability event. Vanguard's Ales Koutny calls France "long-term degrading credit".</p>
<h2>How it links to the rest of the market</h2>
<ul>
<li><b>Rates and oil:</b> France's problem sits on top of higher global rates and oil near $112, which raise borrowing costs everywhere.</li>
<li><b>Equities:</b> the CAC 40 was down about 3% for the year to 15 October, while the wider STOXX Europe 600 was up over 12%.</li>
<li><b>Contagion:</b> France is the eurozone's second-largest economy. Stress in its bonds can spread to Italy, Spain and the euro.</li>
</ul>
<h2>What to watch</h2>
<ul>
<li>Moody's decision on 23 October.</li>
<li>Whether Lecornu gets the budget through, or faces a no-confidence vote.</li>
<li>The French-German spread: a move past 160 basis points would be a new warning sign.</li>
<li>Whether the protests grow or fade.</li>
<li>The ECB, which can buy bonds in a crisis but only under conditions.</li>
</ul>
<p><i>This article is for information only and is not investment advice.</i></p>` },

    { id: "fed-has-started-hiking", date: "2026-10-22", tags: ["Rates", "Macro", "Commodities"],
      title: "The Fed has started hiking, and oil is making it hard to stop",
      dek: "The Fed raised rates in September and is expected to pause next week. Oil at $110 and a red-hot inflation report mean the pause may not last. Here is what's at stake.",
      sources: [
        { t: "FXStreet: Fed preview, on hold in October, hiking resumes later (22 Oct 2026)", u: "https://www.fxstreet.com/analysis/fed-preview-on-hold-in-october-hiking-resumes-later-202610221047" },
        { t: "24/7 Wall St: September PPI (22 Oct 2026)", u: "https://247wallst.com/investing/2026/10/22/with-september-ppi-coming-in-red-hot-is-an-october-rate-hike-all-but-assured/" },
        { t: "Business Standard: Stock market close, 22 Oct 2026", u: "https://www.business-standard.com/amp/markets/news/stock-market-live-october-22-nse-bse-sensex-today-nifty50-gift-nifty-jio-ipo-today-126102200085_1.html" }
      ],
      body: `
<div class="takeaway"><p>The Fed raised rates by 0.25 percentage points in September, the first move of this cycle. The decision on 28 October is widely expected to be a hold, with markets giving only a 15% to 25% chance of another hike. But inflation keeps surprising upwards, and economists such as those at Danske Bank expect hikes in December and March. That is why silver ETFs fell about 3% on Thursday, and why the 10-year Treasury yield sits above 5%.</p></div>
<h2>Where rates stand</h2>
<p>After the September move, the upper end of the Fed's target range is 4.00%, according to 24/7 Wall St. Kevin Warsh is the Fed chair. Powell has stepped down.</p>
<h2>Why inflation is the problem</h2>
<p>September's producer price index, released on 15 October, was far above forecasts:</p>
<ul>
<li><b>Monthly:</b> +1.3% against 0.5% expected, the biggest monthly jump in over four years.</li>
<li><b>Annual:</b> 6.3% against 5.3% expected, the highest since 2022.</li>
<li><b>Core (excluding food and energy):</b> +0.7% on the month and 5.0% on the year, both above forecast.</li>
</ul>
<p>Producer prices are what businesses pay for inputs, and they often feed through to consumer prices later. Danske says recent upside surprises mainly reflect higher energy costs, and that core inflation has edged up slightly as well.</p>
<h2>The oil link</h2>
<p>Brent is around $112, after attacks on Saudi Aramco's oilfield. Energy costs raise inflation directly through fuel, and indirectly through transport and production. Normally a central bank can "look through" a temporary oil spike. The risk now is that oil has stayed high for months, and there is a war premium that could last.</p>
<h2>Why the Fed might wait</h2>
<ul>
<li>Vice-Chairs Williams, Jefferson and Bowman reportedly want more data before hiking, arguing financial conditions have already tightened since September. Falling stocks and a bond market above 5% do some of the Fed's work for it.</li>
<li>San Francisco Fed President Mary Daly said hikes are likely needed, but not urgently.</li>
<li>Danske expects two or three members to dissent in favour of a hike.</li>
</ul>
<h2>Why the Fed might not be able to wait</h2>
<p>Growth looks strong: the Atlanta Fed's tracker puts third-quarter GDP growth at 3.5% annualised, and the labour market looks solid. That means the Fed doesn't have a weak economy as a reason to hold off.</p>
<h2>What it means for markets</h2>
<ul>
<li><b>Growth stocks:</b> Higher rates reduce the value of profits far in the future, which hurts AI companies. Borrowing costs are rising just as AI spending needs more debt.</li>
<li><b>Gold and silver:</b> They pay no income, so Treasuries yielding about 5% compete with them.</li>
<li><b>India:</b> Higher US rates and a stronger dollar can pull money out of emerging markets, on top of oil lifting India's import bill.</li>
</ul>
<h2>What to watch</h2>
<ul>
<li>The decision and the number of dissents on 28 October.</li>
<li>The wording on December.</li>
<li>The next inflation reports. A cooler print would help markets, and another hot one would make a December hike very likely.</li>
<li>Brent: a fall back below $100 would take pressure off the Fed.</li>
</ul>
<p><i>This article is for information only and is not investment advice.</i></p>
` },
    { id: "kyiv-cluster-warheads-after-peace-talks", date: "2026-10-22", tags: ["Geopolitics", "Commodities", "Macro"],
      title: "Hours after \u201cpeace talks\u201d, Russia hit Kyiv with cluster warheads",
      dek: "Trump's envoy praised Putin as a \u201chumanitarian\u201d on Wednesday. By Thursday morning, Kyiv was counting the damage. Here is what happened, what is actually agreed, and why oil traders are watching.",
      sources: [],
      body: `
<div class="takeaway"><p>A new US push to restart Ukraine peace talks has produced no commitments from Russia. Within hours of Steve Witkoff meeting Vladimir Putin in St Petersburg, Russia fired more than 20 missiles at Kyiv, including ballistic missiles that Zelenskyy says carried cluster warheads. Two people died and more than 30 were injured. Zelenskyy says the attack shows "no real change" in Russia's attitude.</p></div>
<p>Trump's envoy praised Putin as a "humanitarian" on Wednesday. By Thursday morning, Kyiv was counting the damage. Here is what happened, what is actually agreed, and why oil traders are watching.</p>
<h2>What happened</h2>
<ul>
<li><b>The diplomacy.</b> Witkoff met Zelenskyy and several European leaders in Oslo earlier this week, then went to St Petersburg on Wednesday to meet Putin. Russian officials say they discussed restarting talks with Ukraine in mid-November and a possible summit of the US, Russia and China in Shenzhen next month.</li>
<li><b>The attack.</b> Overnight Russia hit Kyiv with more than 20 missiles. Zelenskyy says three ballistic missiles carried cluster warheads, which scatter bomblets over a wide area. One landed in the historic Pechersk district. Damage was recorded across six districts, including an ambulance station, metro infrastructure near the South Bridge and a shopping centre.</li>
<li><b>The defence gap.</b> Ukraine's air force said it shot down 181 of 210 long-range drones. The report mentioned no missile interceptions. Zelenskyy has complained that the Pentagon is delaying deliveries of interceptor missiles, and Ukrainian intelligence expects Russia to step up its air campaign in the coming weeks.</li>
<li><b>Ukraine's reply.</b> Ukraine launched more than 600 drones towards Moscow. Three people were injured, the capital's airports suspended operations for several hours, and a military arsenal was reportedly damaged. Moscow's mayor said it was the third-largest drone attack on the city this year.</li>
</ul>
<h2>What is actually agreed?</h2>
<p>Very little.</p>
<ul>
<li>Zelenskyy says Ukraine has "received feedback" that Ukraine, Russia and the US agreed to revive three-way talks, which stopped when the war in Iran began earlier this year. He hopes they meet in early November, but no date is confirmed.</li>
<li>The Kremlin says Abu Dhabi is under consideration as a venue, but no decision has been made on who will represent Moscow. It has not committed to renewed talks.</li>
<li>European officials who were at the Oslo meetings doubt the US push is making headway.</li>
<li>US media report that Trump wants a peace deal at the G20 in Miami in December. The Kremlin says it hasn't decided whether Putin will attend.</li>
</ul>
<h2>The two demands that don't match</h2>
<p>Kyiv wants an energy ceasefire before winter, so Russia stops hitting Ukrainian power plants. Trump has repeatedly demanded that Ukraine stop striking Russian refineries and oil terminals. Each side's demand protects its own energy system, and neither has agreed to the other's.</p>
<h2>Why markets care (analysis)</h2>
<p>Brent is already around $112 because of the Saudi and Middle East crisis. Ukraine's strikes on Russian refineries and terminals add to supply worries, so any deal that paused them would ease pressure on oil, and a breakdown would not. That makes Ukraine one more factor behind the oil price on top of the Gulf. Nobody has announced such a deal, so this is a risk to watch rather than a forecast.</p>` },

    { id: "india-the-ai-hedge", date: "2026-10-22", tags: ["India", "AI", "Markets"],
      title: "India is the world's AI hedge. Thursday tested it.",
      dek: "Global investors are buying India because it barely owns the AI boom. On a day when AI stocks fell, India fell too. Here is why, and why the thesis isn't broken.",
      sources: [
        { t: "J.P. Morgan Insights: Rajiv Batra on India (15 Sep 2026)", u: "https://www.jpmorgan.com/insights" },
        { t: "Business Standard: Stock market close, 22 Oct 2026", u: "https://www.business-standard.com/amp/markets/news/stock-market-live-october-22-nse-bse-sensex-today-nifty50-gift-nifty-jio-ipo-today-126102200085_1.html" },
        { t: "India TV: Sensex and Nifty opening, 22 Oct 2026", u: "https://www.indiatvnews.com/business/markets/sensex-nifty-opening-october-22-stock-market-updates-gift-nifty-brent-crude-oil-price-geopolitical-tension-asian-markets-2026-10-22-1057584" }
      ],
      body: `
<div class="takeaway"><p>The idea is simple. If you are worried about the AI trade, you need somewhere to put money that doesn't depend on it. J.P. Morgan's Rajiv Batra has argued that India is the best candidate among major emerging markets. Thursday was a hard test. The Sensex fell 460 points (0.62%) to 73,249 and the Nifty fell 124 points (0.54%) to 22,688, their third straight daily loss. But the cause was oil, not AI, and the fall was much smaller than in the rest of Asia.</p></div>
<h2>What "hedge" means</h2>
<p>A hedge is an asset that holds up when something else you own falls. Most major markets are now heavily exposed to AI, through chipmakers in Taiwan and Korea and Big Tech in the US. India has almost none of that. Its biggest companies are banks, energy, consumer firms and IT services. That makes it a different bet from the rest of emerging markets.</p>
<h2>The case, in four points</h2>
<ul>
<li><b>Little AI exposure.</b> India is a large part of the MSCI Emerging Markets index (roughly 12%), but almost none of its weight comes from AI hardware.</li>
<li><b>Earnings growth that doesn't need AI.</b> Batra points to small- and mid-cap earnings growth above 25%, driven by domestic demand.</li>
<li><b>Domestic buyers.</b> Indian institutions keep buying. On Wednesday, domestic institutions bought about ₹1,614 crore of equities.</li>
<li><b>Foreigners are underweight.</b> Foreign ownership of Indian stocks is only about 17.6%. J.P. Morgan estimates up to $115bn could flow in if global investors rotate away from crowded AI trades.</li>
</ul>
<h2>Evidence it was working</h2>
<p>The Nifty IT index rose about 11.7% in the week to 16 October as the AI debate went on. Indian IT services firms sell the people and software that help companies use AI, rather than spending on data centres.</p>
<h2>Thursday's test</h2>
<p>Asia fell hard: Japan's Nikkei dropped 1.7%, Hong Kong's Hang Seng 2.8% and Korea's Kospi 2.7%. India lost about half a percent, so it held up better than the chip-heavy markets. But it did not go up, and that is the weakness in the hedge.</p>
<ul>
<li><b>Oil is the problem.</b> Brent rose about 3% to roughly $112.50 after attacks on Saudi Aramco oilfield sites. India imports most of its oil. J.P. Morgan's thesis assumed oil around $80 to $85, so $112 is far outside its comfort zone.</li>
<li><b>Tech wasn't spared.</b> The Nifty IT index fell about 1.4% as the US tech rally faded.</li>
<li><b>Breadth was weak.</b> Early on, about 1,845 stocks fell against 648 rising. Midcaps fell about 0.9% and smallcaps over 1%.</li>
</ul>
<h2>What to watch</h2>
<ul>
<li><b>Brent.</b> If it stays above $110, India's earnings and the rupee come under pressure.</li>
<li><b>Infosys results on 23 October.</b> This shows whether Indian IT can keep earning from AI demand.</li>
<li><b>Foreign flows.</b> The $115bn rotation only matters if foreign money actually arrives.</li>
<li><b>Technical levels.</b> Analysts cite 22,200 to 22,400 on the Nifty as support and 22,900 as resistance.</li>
</ul>
<p><i>This article is for information only and is not investment advice.</i></p>
` },
    { id: "bankrolling-the-ai-boom", date: "2026-10-22", tags: ["AI", "Markets", "Macro"],
      title: "Why you're probably bankrolling the AI boom, and you never signed up",
      dek: "From Big Tech's profits to the bond market to pension funds, almost every pool of savings is now tied to the AI build-out. Thursday's selloff shows what that means.",
      sources: [
        { t: "Financial Times: Who's paying for the AI build-out? Probably you (21 Oct 2026)", u: "https://www.ft.com/content/09f56730-4702-446d-9986-f7c93ffe6bf0" },
        { t: "Meta Platforms Form 10-Q, quarter ended 30 Sep 2026", u: "https://www.sec.gov/Archives/edgar/data/0001326801/000162828026066773/meta-20260930.htm" },
        { t: "Yahoo Finance: stock market today, 20 Oct 2026 (Oracle and CoreWeave credit costs)", u: "https://finance.yahoo.com/markets/live/stock-market-today-dow-rises-sp-500-nasdaq-climb-as-dip-buying-resumes-165236471.html" },
        { t: "Gotrade: Nvidia stock news, 19 Oct 2026 (CoreWeave bond yields)", u: "https://www.heygotrade.com/en/news/nvidia-nvda-stock-news-october-19-2026/" } ],
      body: `
<div class="takeaway"><p>On Thursday, AI stocks fell sharply. The Nasdaq dropped about 2%, chipmakers fell harder, and Meta lost about 6% a day after reporting a strong quarter. The trigger was not weak sales. It was a question investors have started asking out loud: who is paying for all of this?</p></div>
<h2>A bill with no modern equivalent</h2>
<p>One estimate, from Stijn Van Nieuwerburgh of Brookings and cited by the Financial Times, puts the cost of the AI infrastructure boom at about 3.6% of US GDP every year until 2032. That is roughly $10.3 trillion in total, counting only physical spending such as data centres and chips. As a share of the economy, each year of that spending matches the 19th-century railroad boom, the interstate highway programme and two-thirds of the early 20th-century electrification of America, all added together.</p>
<h2>Big Tech is spending more than it earns</h2>
<p>The six biggest spenders (Alphabet, Amazon, Microsoft, Meta, Oracle and SpaceX) are expected to generate about $760 billion in cash this year. The FT reports that they will spend all of it and more, so free cash flow, the money left after investing, is negative. Meta shows this. Last quarter it spent $34.9 billion on capex against $32.8 billion of operating cash flow, leaving free cash flow at negative $2.1 billion. Wall Street expects negative free cash flow to continue for several years, in the hope that profits keep growing at around 30% a year.</p>
<h2>The money goes round in circles</h2>
<p>The chipmakers receiving that spending are investing heavily too. The 30 biggest are on track to spend over $200 billion this year, double the level three years ago. Nvidia holds $94 billion of equity investments, including stakes in OpenAI, Anthropic and CoreWeave, which are also its customers. In plain terms, the suppliers are helping to fund the buyers.</p>
<h2>Then there's the debt</h2>
<p>Morgan Stanley counts $466 billion of AI-related debt issued this year. Most of it has investment-grade ratings, either because big tech companies guarantee it or because it is secured against the chips. The risk is that the same companies spending all their profits on these projects are also guaranteeing the loans, and the chips used as collateral lose value if demand disappoints. Markets are already pricing some of that worry. CoreWeave's long-dated bonds have been trading at yields near 15%, and one report says the cost of insuring Oracle's debt is at its highest since at least 2021.</p>
<h2>How it reaches you</h2>
<p>The six hyperscalers and the big chipmakers are worth about $31 trillion, around 20% of the world's stock market. US households hold nearly a third of their assets in stocks, so many are heavily exposed. Investment-grade bonds are also what pensions, annuities and life insurance policies hold. If you have any of those, part of your savings already sits in AI infrastructure.</p>
<h2>Why Thursday mattered</h2>
<p>Meta's announcement of a new non-voting share class added to the worry. It gives the company a way to raise money without diluting its founder's votes, and other shareholders would bear the dilution. Together with oil above $110 and rate fears, it pushed investors to ask whether the returns will arrive before the money runs out.</p>
<p><b>What to watch:</b> whether free cash flow turns positive, how bond yields for AI borrowers like CoreWeave and Oracle move, and how much more Big Tech raises its spending in the next round of earnings.</p>
<p><i>This article is for information only and is not investment advice.</i></p>` },

    { id: "why-oil-is-above-110", date: "2026-10-22", tags: ["Commodities", "Geopolitics", "Macro"],
      title: "Why oil is above $110: Houthi attacks on Saudi Arabia and a Middle East war that hasn't ended",
      dek: "Oil is rising because three separate threats to Gulf supply are now overlapping.",
      sources: [],
      body: `
<div class="takeaway"><p>Brent crude rose above $110 a barrel on Thursday, touching about $112 at one point, and US crude rose to around $98-99. Three things are pushing prices up. The Houthis in Yemen are attacking Saudi Arabia's airports and Aramco oil sites. Iran is attacking tankers in the Strait of Hormuz, the route for about a fifth of the world's oil in normal times. And reports say the US is preparing renewed strikes on Iran after the November 3 midterm elections. For context, Brent first passed $100 in March, when the war began, and peaked at $126.</p></div>
<h2>Why are the Houthis attacking Saudi Arabia?</h2>
<p>The Houthis are an Iran-backed armed group that has controlled Sanaa and most of western Yemen since 2014. Saudi Arabia led a coalition against them from 2015. A UN-brokered truce in April 2022 largely held for more than four years, until it collapsed in July 2026.</p>
<p>The trigger was a strike on Sanaa airport. The Houthis blamed Saudi Arabia, saying it targeted a delegation returning from Iran, while another account says Yemeni government forces carried it out. The Houthis then began firing missiles and drones at Saudi oil facilities, and in July they declared a maritime embargo on the kingdom. The Houthis say they want an end to what they call a Saudi blockade of Yemen's ports and airports, and recognition as Yemen's legitimate government. Analysts say the attacks are meant to put economic pressure on Riyadh to reach a political settlement.</p>
<p>Several things escalated it in September and October:</p>
<ul>
<li><b>The war with Iran.</b> The Houthis fired missiles at Israel in March, when the US-Iran war began. Hormuz disruption has made Saudi Arabia more dependent on its Red Sea exports, which gives the Houthis more leverage, according to analysts.</li>
<li><b>Battlefield changes.</b> The Houthis took the port of Mocha and Red Sea islands in September. Saudi-backed Yemeni forces launched an offensive called "Dawn of Yemen" on October 4, and the Houthis dispute the government's claim to have retaken Mocha.</li>
<li><b>Tit-for-tat strikes.</b> After a Saudi-led coalition strike on an oil facility in Sanaa, the Houthis called Aramco sites "legitimate targets" and struck an Aramco office in Dhahran. An attack on Riyadh's King Khalid airport on October 10 killed more than a dozen people and injured over 300.</li>
</ul>
<p>The Houthis are close to Iran but are considered relatively independent of it, and Saudi Arabia says it will retaliate firmly. President Trump has said the US "may" join Saudi operations but has not decided.</p>
<h2>What has been hit</h2>
<p>On Thursday a Houthi drone aimed at a processing plant near Aramco's Shaybah oilfield was intercepted, but falling debris killed two people. Shaybah produces about one million barrels a day, and Saudi Arabia says operations were unaffected. Hours later an attack on King Fahd International Airport in Dammam killed two people and wounded eight. The Houthis also claim strikes on Aramco facilities in Yanbu, though that is unconfirmed. Crude flows on Saudi Arabia's East-West pipeline, which carries up to about seven million barrels a day to the Red Sea and avoids Hormuz, were reportedly halted on October 5 after a strike on a pumping station. That pipeline matters because it is the main alternative if Hormuz is blocked.</p>
<h2>The Strait of Hormuz</h2>
<p>The wider war began on February 28, when the US and Israel struck Iran. Iran declared the strait closed. A ceasefire in April and a memorandum in June did not hold, and the truce collapsed in July. In October tanker attacks rose sharply: UKMTO, which monitors shipping, recorded at least 12 attacks in the week to October 16. Kpler data show flows through the strait fell to 2.9 million barrels a day on October 11, against 17.1 million before the war. The US says it controls the strait, and Iran says ships that don't coordinate with it risk hitting mines. Neither claim is independently verified.</p>
<h2>Fear of renewed US strikes</h2>
<p>The New York Times reported on October 8 that Trump had ordered the Pentagon to draw up plans for returning to fighting, including a short, intense campaign of about three days. A further report cited by CNBC says the US and Israel plan strikes after the midterms. These are plans, not decisions: officials have proposed major operations five times in recent months, and Trump has rejected each one.</p>
<h2>Why it matters for markets</h2>
<p>Higher oil adds to inflation worries and weighs on stocks. The Nasdaq fell about 2% on Thursday as oil rose and AI stocks sold off, and investors moved into Treasuries.</p>
<p>What to watch: shipping data on Hormuz flows, whether the East-West pipeline restarts, further Houthi attacks on Aramco sites, and any US decision after November 3.</p>
<p><i>This article is for information only and is not investment advice.</i></p>` },

<p class="label">Moves are from early Thursday trading and will change by the close.</p>
<h2>Why</h2>
<h3>1. Meta and Tesla did not settle the spending question</h3>
<p>Meta beat revenue estimates on Wednesday, with sales up 26% to $64.6 billion. But it spent $34.9 billion on capex in the quarter, free cash flow turned negative at -$2.1 billion, and full-year capex guidance is $135-145 billion. Tesla beat on earnings but cut its 2026 spending outlook, raising doubts about AI demand even as it plans more spending in 2027 and 2028 on projects such as Optimus and Cybercab.</p>

    { id: "meta-shares-fall-despite-beat", date: "2026-10-22", tags: ["Equities", "AI", "Earnings"],
      title: "Meta's share price falls 6% despite a revenue rise, EPS beat and volume growth",
      dek: "Meta's share price fell about 6.5% in early trading on Thursday, a day after a quarter that beat expectations. Here's why.",
      sources: [],
      body: `
<div class="takeaway"><p>The earnings were not the problem. The announcement of a new class of non-voting shares was.</p></div>
<h2>The quarter was strong</h2>
<p>Revenue rose 26% to $64.6 billion, ahead of the roughly $63.4 billion analysts expected. Ad impressions grew 10% and the average price per ad rose 14%, so growth came from both volume and pricing. Meta guided fourth-quarter revenue to $73-76 billion, above consensus. Excluding a one-off legal charge, earnings per share of $7.40 also beat estimates.</p>
<h2>Where are the issues?</h2>
<p>The bigger issue is cash. Capital expenditure was $34.9 billion in the quarter, against operating cash flow of $32.8 billion, so free cash flow was negative $2.1 billion. Full-year capex guidance is $135-145 billion, almost double last year ($73 billion).</p>
<p>Alongside the results, Meta announced a one-time dividend of one non-voting Class C share for every Class A and Class B share, effective from January 19, 2027. It works like a 2-for-1 split. Nothing changes in value for shareholders on the day, and voting power is unchanged.</p>
<p>The catch is what the new shares can be used for. Meta can issue Class C stock later to raise capital, pay staff or fund acquisitions. Any new issuance dilutes existing owners' economic stake. Because the new shares carry no votes, it does not dilute Mark Zuckerberg's control. He keeps about 60.6% of the votes on a 13.4% economic stake. Controlling holders approved the change by written consent, so other shareholders did not vote on it.</p>
<h2>The AI bill</h2>
<p>The bigger issue is how fast the spending is growing:</p>
<ul>
<li><b>Quarterly capex:</b> $34.9 billion in Q3, up from $31 billion in Q2 and $19.4 billion a year ago.</li>
<li><b>Full-year capex:</b> guided to $135-145 billion, against about $72 billion in 2025. Analysts' consensus has risen by more than $14 billion since April.</li>
<li><b>Free cash flow:</b> negative $2.12 billion in Q3, down from positive $784 million in Q2. Operating cash flow of $32.8 billion did not cover the spending.</li>
<li><b>Expenses:</b> full-year total expense guidance was raised to $175-179 billion, partly to include the legal charge. Meta also reported long-term debt raising of $24.9 billion.</li>
<li><b>Reality Labs:</b> the VR and AI-device unit lost $4.13 billion on $443 million of sales.</li>
</ul>
<h2>Why investors worry</h2>
<p>Meta has fallen sharply on spending news before. Shares dropped after it raised its capex outlook in April, fell more than 9% in July when profit missed, and fell more than 10% after the Q3 2025 results. The concern is the same each time: the spending is rising faster than the evidence that it will pay off, and Meta, unlike some rivals, funds it mainly from advertising profit. A quarter of negative free cash flow makes the question of who pays for it more urgent.</p>
<h2>Why the shares fell today</h2>
<p>The AI spending is the underlying concern, and the share class is what makes it concrete. Meta is spending more than it generates in cash, has been borrowing, and now has a way to sell stock without giving up control. Existing shareholders, who had no vote on the change, may end up helping to pay for the build-out. That is the likely reason the stock reversed from its after-hours gain. This is an inference from the timing and from analyst commentary, not something Meta has said, and it is not possible to say how much of the fall came from each factor.</p>
<p><i>This article is for information only and is not investment advice.</i></p>` },

    { id: "meta-ai-bill-outruns-cash-flow", date: "2026-10-21", tags: ["AI", "Earnings"],
      title: "Meta's AI bill now outruns its cash flow",
      dek: "Record revenue, but negative free cash flow in the quarter. The market rewarded the sales and ignored the funding gap for now.",
      sources: [
        { t: "Yahoo Finance earnings live", u: "https://finance.yahoo.com/markets/live/earnings-live-updates-all-eyes-on-musk-and-meta-as-q3-earnings-roll-on-134152191.html" },

      body: `
<div class="takeaway"><p>Meta posted record revenue of about $64B, but spent $34.9B on capex in the quarter against negative free cash flow of $2.1B. The AI build-out is now being funded by something other than the cash the business generates.</p></div>
<h2>What happened</h2>
<p>Revenue beat the $63.3B consensus. GAAP earnings per share were $3.83, above the $3.56 expected, but that figure includes a legal charge tied to a teen mental-health settlement. Without it, EPS would have been $7.40. Full-year capex guidance was narrowed to $135–145B, with the low end raised from $130B.</p>
<h2>Why it matters</h2>
<p>When free cash flow turns negative while sales are at a record, the question moves from "is demand there?" to "who pays for the capacity?" Higher guided capex means more of the cost lands on the balance sheet, through debt or lower buybacks, before the revenue shows up. The after-hours rally says investors still trust the return on that spend.</p>
<h2>My view</h2>
<p>Revenue strength buys Meta time, not a pass. I would watch free cash flow and the capex guide each quarter, because they show whether spending is running ahead of monetisation.</p>
<h2>What would change my mind</h2>
<ul><li>Free cash flow staying negative for a second quarter without faster revenue growth.</li><li>The capex guide moving above $145B.</li></ul>` },

  const n = notes[i], newer = notes[i - 1], older = notes[i + 1];
  return '<article class="art"><a class="back" href="#articles">← All articles</a><h1>' + esc(n.title) + '</h1><p class="dek">' + esc(n.dek) +
    '</p><div class="byline"><span class="label">' + fmtDate(n.date) + '</span><span class="tag">' + n.tags.map(esc).join(" · ") + '</span><span class="label">' + readMin(n) +
    "</span></div>" + n.body + (n.sources && n.sources.length ? srcList(n.sources) : "") +
    '<div class="pn">' + (newer ? '<a href="#article-' + newer.id + '"><span class="label">Newer</span><b>' + esc(newer.title) + "</b></a>" : "<span></span>") +
    (older ? '<a href="#article-' + older.id + '" style="text-align:right"><span class="label">Older</span><b>' + esc(older.title) + "</b></a>" : "") + "</div></article>";
}
function pageAbout() {
  return '<div class="about"><h1 class="page-h">About</h1>' + SITE.about.map(p => "<p>" + esc(p) + "</p>").join("") +
    '<p class="links">' + (SITE.aboutLinks || []).map(l => '<a href="' + esc(l.u) + '" target="_blank" rel="noopener">' + esc(l.t) + " ↗</a>").join(" ") + "</p>" +
    '<div class="sec-h" style="margin-top:28px"><h2>What you will find here</h2></div><ul style="margin-top:14px">' + SITE.how.map(p => "<li>" + esc(p) + "</li>").join("") + "</ul></div>";
}

function route() { const h = (location.hash || "").slice(1); return h || "home"; }
function render(t) {
  let html = null, nav = t;
  if (t === "home") html = pageHome();
  else if (t === "markets") html = pageMarkets();
  else if (t === "ai") html = pageAI();
  else if (t === "earnings") html = pageEarnings();
  else if (t === "macro") html = pageMacro();
  else if (t === "articles") html = pageNotes();
  else if (t === "about") html = pageAbout();
  else if (t.indexOf("article-") === 0) { html = pageNote(t.slice(8)); nav = "articles"; }
  if (html == null) { html = pageHome(); nav = "home"; }
  $("#app").innerHTML = html;
  document.querySelectorAll("#nav a").forEach(a => {
    if (a.dataset.route === nav) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
}
function go(t) {
  try { history.pushState(null, "", "#" + t); } catch (e) {}
  render(t); window.scrollTo(0, 0);
}

document.addEventListener("click", ev => {
  const a = ev.target.closest && ev.target.closest('a[href^="#"]');
  if (a) { ev.preventDefault(); go(a.getAttribute("href").slice(1) || "home"); return; }
  const b = ev.target.closest && ev.target.closest("button[data-tag]");
  if (b) { activeTag = b.dataset.tag; render("articles"); }
});
window.addEventListener("popstate", () => render(route()));
window.addEventListener("hashchange", () => render(route()));

$("#theme").addEventListener("click", () => {
  const root = document.documentElement;
  const dark = root.dataset.theme === "dark";
  const next = dark ? "light" : "dark";
  root.dataset.theme = next;
  try { localStorage.setItem("rr-theme", next); } catch (e) {}
});
try { const t = localStorage.getItem("rr-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}

$("#mark").textContent = SITE.name;
$("#today").textContent = SITE.tagline;
$("#disc").textContent = SITE.disclaimer;
$("#copy").textContent = "© " + new Date().getFullYear() + " Rudraj Mehta";
renderRail();
render(route());

/* ---- Live quotes: /api/quotes (Yahoo Finance, delayed). Falls back silently to the figures above. ---- */
function fmtNum(sym, p) {
  if (/^\^(TNX|FVX|TYX)$/.test(sym)) return p.toFixed(2) + "%";
  if (/=X$/.test(sym)) return p.toFixed(p < 20 ? 4 : 2);
  const d = p >= 1000 ? 0 : 2;
  const t = p.toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
  return /^\^|^DX-Y|\.SS$/.test(sym) ? t : "$" + t;
}
function applyQuotes(q) {
  let n = 0;
  const touch = r => {
    const x = r.sym && q[r.sym]; if (!x) return;
    const key = r.p !== undefined || r.t ? "p" : "v";
    r[key] = fmtNum(r.sym, x.p);
    r.c = /^\^(TNX|FVX|TYX)$/.test(r.sym) ? null : x.c;
    delete r.note; delete r.ah; n++;
  };
  SITE.snapshot.groups.forEach(g => g.rows.forEach(touch));
  SITE.ai.rows.forEach(touch);
  return n;
}
async function loadLive() {
  try {
    const ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), 8000);
    const r = await fetch("/api/quotes", { signal: ctl.signal }); clearTimeout(timer);
    if (!r.ok) return;
    const j = await r.json();
    if (!applyQuotes(j.quotes || {})) return;
    const hm = new Date(j.updated).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
    SITE.snapshot.asOf = "Live, delayed · updated " + hm;
    SITE.ai.asOf = "Live, delayed · " + hm;
    SITE.snapshot.caveat = "Live quotes from Yahoo Finance, delayed by up to 15 minutes. The 2-year yield is from the 21 Oct close. Rows that show a dash were not returned by the data feed.";
    renderRail(); render(route());
  } catch (e) { /* keep static figures */ }
}
loadLive();
setInterval(loadLive, 120000);
</script>
